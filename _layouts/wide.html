---
layout: base
---

<div class="page-head">
  <div class="wrap page-head__inner">
    {%- if page.eyebrow %}<span class="eyebrow">{{ page.eyebrow }}</span>{% endif -%}
    <h1>{{ page.heading | default: page.title }}</h1>
    {%- if page.subtitle %}<p class="lede">{{ page.subtitle }}</p>{% endif -%}
  </div>
</div>

{{ content }}
