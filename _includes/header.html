<header class="site-header">
  <div class="wrap site-header__inner">
    <input type="checkbox" id="nav-toggle" class="nav-toggle visually-hidden">

    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand__name">{{ site.title }}</span>
      <span class="brand__role">{{ site.role }} · UT Austin</span>
    </a>

    <label class="nav-toggle-label" for="nav-toggle" aria-label="Toggle navigation menu">
      <svg class="icon-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </label>

    <nav class="site-nav" aria-label="Main">
      {%- for item in site.data.navigation.docs -%}
        {%- assign href = item.url | relative_url -%}
        <a href="{{ href }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {%- endfor -%}
      {%- comment -%} Lowercase "cv" is the name git tracks; GitHub Pages is case-sensitive. {%- endcomment -%}
      <a class="nav-cta" href="{{ '/files/UmbertoVilla_cv.pdf' | relative_url }}">CV</a>
    </nav>

    <button class="theme-toggle" type="button" id="theme-toggle" aria-label="Switch between light and dark theme">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>
