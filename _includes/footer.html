<footer class="site-footer">
  <div class="wrap site-footer__inner">
    <div class="site-footer__logos">
      <a href="https://www.bme.utexas.edu/" target="_blank" rel="noopener">
        <img src="{{ '/images/footer_ut/bmelogo.svg' | relative_url }}" alt="UT Austin Department of Biomedical Engineering">
      </a>
      <a href="https://oden.utexas.edu" target="_blank" rel="noopener">
        <img src="{{ '/images/footer_ut/Oden.png' | relative_url }}" alt="Oden Institute for Computational Engineering and Sciences">
      </a>
    </div>

    <div>
      <ul class="footer-links">
        {%- for p in site.profiles -%}
        <li><a href="{{ p.url }}" target="_blank" rel="noopener">{{ p.name }}</a></li>
        {%- endfor -%}
        <li><a href="{{ '/contact.html' | relative_url }}">Contact</a></li>
      </ul>
      <p class="site-footer__meta">
        &copy; {{ site.time | date: "%Y" }} {{ site.author }}. Built with
        <a href="https://jekyllrb.com" target="_blank" rel="noopener">Jekyll</a>,
        hosted on <a href="https://pages.github.com" target="_blank" rel="noopener">GitHub Pages</a>.
      </p>
    </div>
  </div>
</footer>

<script>
  (function () {
    var btn = document.getElementById("theme-toggle");
    if (!btn) return;
    btn.addEventListener("click", function () {
      var root = document.documentElement;
      var current = root.getAttribute("data-theme");
      if (!current) {
        current = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      var next = current === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("theme", next); } catch (e) {}
    });

    /* Close the mobile menu after following an in-page link. */
    var toggle = document.getElementById("nav-toggle");
    if (toggle) {
      document.querySelectorAll(".site-nav a").forEach(function (a) {
        a.addEventListener("click", function () { toggle.checked = false; });
      });
    }
  })();
</script>

{%- if site.google_analytics and jekyll.environment == "production" -%}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ site.google_analytics }}');
</script>
{%- endif -%}
